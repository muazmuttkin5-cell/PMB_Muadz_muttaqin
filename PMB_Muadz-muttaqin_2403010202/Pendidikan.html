<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendidikan - PMB</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-icon">✦</div><span>PMB Kampus Utama</span></div>
      <span class="autosave">● Penyimpanan sementara</span>
    </header>
<nav class="stepper">
  <a href="Identitas.html" class="step done">
    <span class="step-number">✓</span>
    <span>1 Identitas</span>
  </a>

  <a href="Pendidikan.html" class="step active">
    <span class="step-number">2</span>
    <span>2 Pendidikan</span>
  </a>

  <a href="Pendaftaran.html" class="step">
    <span class="step-number">3</span>
    <span>3 Pilihan</span>
  </a>

  <a href="DataTransaksiPembayaran.html" class="step">
    <span class="step-number">4</span>
    <span>4 Pembayaran</span>
  </a>
</nav>

    <main class="content">
      <div id="message" class="notice" hidden></div>
      <div class="step-meta"><span class="pill">Langkah 2 dari 4</span></div>
      <h1>Data Pendidikan Asal</h1>
      <p class="subtitle">Masukkan riwayat pendidikan dan data orang tua.</p>

      <form id="pendidikanForm" data-page="pendidikan">
        <section class="card">
          <h2>Pendidikan Terakhir</h2>
          <div class="form-grid">
            <label class="field">Nama Sekolah <span class="required">*</span>
              <input name="sekolah" required>
            </label>
            <label class="field">NPSN <span class="required">*</span>
              <input name="npsn" type="text" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" required>
              <span class="hint">8 digit angka</span>
            </label>
            <label class="field">Jurusan / Program <span class="required">*</span>
              <input name="jurusan" required>
            </label>
            <label class="field">Tahun Lulus <span class="required">*</span>
              <input name="tahun_lulus" type="number" min="1980" max="2100" required>
            </label>
            <label class="field">Rata-rata Nilai Rapor <span class="required">*</span>
              <input name="nilai_rapor" type="number" min="0" max="100" step="0.01" required>
            </label>
            <label class="field">Skor UTBK <span class="required">*</span>
              <input name="skor_utbk" type="number" min="0" max="1000" step="0.01" required>
            </label>
          </div>
        </section>

        <section class="card">
          <h2>Data Orang Tua atau Wali</h2>
          <div class="form-grid">
            <label class="field">Nama Ayah <span class="required">*</span>
              <input name="nama_ayah" required>
            </label>
            <label class="field">Nama Ibu <span class="required">*</span>
              <input name="nama_ibu" required>
            </label>
            <label class="field">Pekerjaan Ayah <span class="required">*</span>
              <input name="pekerjaan_ayah" required>
            </label>
            <label class="field">Pekerjaan Ibu <span class="required">*</span>
              <input name="pekerjaan_ibu" required>
            </label>
            <label class="field">Penghasilan Orang Tua <span class="required">*</span>
              <select name="penghasilan" required>
                <option value="">Pilih rentang penghasilan</option>
                <option>Di bawah Rp2.000.000</option>
                <option>Rp2.000.000 – Rp5.000.000</option>
                <option>Rp5.000.000 – Rp10.000.000</option>
                <option>Di atas Rp10.000.000</option>
              </select>
            </label>
            <label class="field">Nomor Telepon Orang Tua <span class="required">*</span>
              <input name="telepon_ortu" type="tel" pattern="[0-9+\-\s]{9,16}" required>
            </label>
          </div>
        </section>

        <div class="form-footer">
          <a href="Identitas.html" class="btn btn-secondary">← Kembali</a>
          <button type="submit" class="btn btn-primary">Lanjut ke Pilihan →</button>
        </div>
      </form>
    </main>
    <p class="footer-note">Pastikan data pendidikan dan orang tua sudah benar.</p>
  </main>
</body>
</html>
